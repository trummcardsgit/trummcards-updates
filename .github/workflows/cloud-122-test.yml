name: TrummCards Cloud 1.2.2 - Stock Management TEST
on:
  push:
    branches: [feature/cloud-1.2.2-stock-management]
    paths:
      - 'cloud/**'
      - '.github/workflows/cloud-122-test.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: trummcards-cloud-122-test
  cancel-in-progress: true
jobs:
  verify:
    name: Verify corrections, archives, history and TEST isolation
    runs-on: ubuntu-latest
    env:
      TRUMMCARDS_TEST122_ENABLE: I_ACKNOWLEDGE_TEST_ONLY
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify new stock workflows and existing catalog/image behavior
        run: |
          node --test cloud/release/stock-management122.test.mjs
          node --test cloud/release/inventory-image121.test.mjs
          node --test cloud/release/catalog-pagination-image11.test.mjs
          node --test cloud/release/carddex-vinted12.test.mjs
          node --check cloud/release/prepare-cloud-122-test.mjs
          node --check cloud/desktop-production/src/app.js
          node --check cloud/mobile-production/web/app.js
          node --check cloud/desktop-production/src/finance11.js
          node --check cloud/mobile-production/web/finance11.js
      - name: Prepare separate 1.2.2 TEST-only clients without publishing
        run: |
          node cloud/release/prepare-cloud-122-test.mjs
          node --check cloud/desktop-production/src/app.js
          node --check cloud/mobile-production/web/app.js
          node --check cloud/release/prepare-cloud-122-test.mjs
      - name: Confirm database isolation and disabled Windows auto-updater
        run: |
          set -eu
          grep -q "const PROJECT='cpycfxolqpidfjbhhsmr';" cloud/mobile-production/web/app.js
          grep -q "const WRITES_ENABLED=true;" cloud/mobile-production/web/app.js
          grep -q "trummcards-mobile-test122-session-v1" cloud/mobile-production/web/app.js
          grep -q "trummcards-mobile-test122-shell-" cloud/mobile-production/web/sw.js
          grep -q "const UPDATE_FEED_ENABLED=false;" cloud/desktop-production/main.cjs
          if grep -R 'hgdexyvtgfffcasfpjyu' cloud/mobile-production/web cloud/desktop-production/src/app.js; then
            echo 'FATAL: production database ref leaked into TEST app'
            exit 1
          fi
          node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('cloud/mobile-production/web/manifest.webmanifest','utf8'));if(m.name!=='TrummCards Cloud 1.2.2 TEST')process.exit(1)"
      - name: Keep preview assets for manual testing after SQL migration
        uses: actions/upload-artifact@v4
        with:
          name: TrummCards-Cloud-122-TEST-PWA-STAGED
          path: cloud/mobile-production/web/
          if-no-files-found: error
          retention-days: 7
