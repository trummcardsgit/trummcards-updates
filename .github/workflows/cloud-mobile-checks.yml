name: TrummCards Cloud Mobile TEST - checks only
on:
  pull_request:
    paths:
      - 'cloud/mobile-test/**'
      - '.github/workflows/cloud-mobile-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile and validate PWA shell
        run: |
          node cloud/mobile-test/edge/build.mjs
          node --test cloud/mobile-test/tests/test-mobile.mjs
          node --experimental-strip-types --test cloud/mobile-test/tests/test-routing.mjs
      - name: Confirm no Windows or production deployment
        run: echo 'Mobile PWA static checks only. No deployment or Windows release.'
