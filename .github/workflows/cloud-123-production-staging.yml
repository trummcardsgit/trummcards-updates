name: TrummCards Cloud 1.2.3 - PROD Candidate (NO DEPLOY)
on:
  push:
    branches:
      - feature/cloud-1.2.3-stock-management
    paths:
      - cloud/**
      - .github/workflows/cloud-123-production-staging.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: trummcards-cloud-123-prod-staging
  cancel-in-progress: true
jobs:
  dry-run:
    name: Prepare 1.2.3 production package in CI only
    runs-on: ubuntu-latest
    env:
      TRUMMCARDS_BACKUP_ACTIVE: 'true'
      TRUMMCARDS_RESTORE_VERIFIED: 'true'
      TRUMMCARDS_PRODUCTION_APPROVED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run inventory and existing image regression tests
        run: |
          node --test cloud/release/stock-management123.test.mjs
          node --test cloud/release/inventory-image-121.test.mjs
          node --test cloud/release/carddex-vinted12.test.mjs
      - name: Stage production source WITHOUT deploying or changing database
        run: |
          node cloud/release/prepare-cloud-123-production.mjs
          node --check cloud/desktop-production/src/app.js
          node --check cloud/mobile-production/web/app.js
          node --check cloud/release/prepare-cloud-123-production.mjs
      - name: Verify version, existing updater ID, and source-only gate
        run: |
          set -eu
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p=JSON.parse(fs.readFileSync('cloud/desktop-production/package.json','utf8'));
          const web=fs.readFileSync('cloud/mobile-production/web/index.html','utf8');
          const sw=fs.readFileSync('cloud/mobile-production/web/sw.js','utf8');
          const win=fs.readFileSync('cloud/desktop-production/src/app.js','utf8');
          const mobile=fs.readFileSync('cloud/mobile-production/web/app.js','utf8');
          const source=fs.readFileSync('cloud/desktop-production/main.cjs','utf8');
          if(p.version!=='1.2.3'||p.build.appId!=='at.trummcards.cloudproduction')throw Error('Wrong installer identity');
          if(!p.build.publish?.[0]?.url?.endsWith('/cloud-updates/'))throw Error('Wrong updater feed');
          if(!web.includes('app.js?v=1.2.3')||!sw.includes('trummcards-mobile-production-shell-v123'))throw Error('Wrong PWA version');
          if(!win.includes('const WRITES_ENABLED = true;')||!mobile.includes('const WRITES_ENABLED=true;'))throw Error('Bad release mode');
          if(!win.includes('tc_adjust_inventory')||!mobile.includes('tc_adjust_inventory'))throw Error('Stock functionality missing');
          if(!source.includes('const UPDATE_FEED_ENABLED=true;'))throw Error('Windows updater missing');
          console.log('PASS: 1.2.3 candidate staged with existing auto-updater and no release.');
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: TrummCards-Cloud-123-PROD-CANDIDATE-NOT-LIVE
          path: cloud/mobile-production/web/
          retention-days: 7
          if-no-files-found: error
