name: TrummCards Cloud TEST - Windows Preview (NO RELEASE)

on:
  pull_request:
    paths:
      - 'cloud/desktop-test/**'
      - 'cloud/supabase/migrations/20261015000200_cloud_test_session.sql'
      - 'cloud/supabase/migrations/20261015000300_product_images.sql'
      - '.github/workflows/cloud-windows-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Pruefe Test-App Logik
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud/desktop-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Abhaengigkeiten installieren
        run: npm install --no-audit --no-fund
      - name: Source + FIFO Unit Tests
        run: npm run check
      - name: Browser Bundle erstellen
        run: npm run bundle
      - name: Browser Bundle pruefen
        run: test -s src/vendor.js

  windows-installer:
    name: Separater Cloud-TEST Installer
    needs: test
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    runs-on: windows-latest
    defaults:
      run:
        working-directory: cloud/desktop-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Abhaengigkeiten installieren
        shell: pwsh
        run: npm install --no-audit --no-fund
      - name: Pillow fuer das originale TrummCards-Logo installieren
        shell: pwsh
        run: python -m pip install --disable-pip-version-check pillow
      - name: Windows TEST Installer bauen - ohne GitHub Release
        shell: pwsh
        run: npm run dist
      - name: Installer-Datei pruefen
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $exe = "dist/TrummCards-Cloud-TEST-$version-Setup.exe"
          if (-not (Test-Path $exe)) { throw 'Cloud TEST Installer fehlt.' }
          if ((Get-Item $exe).Length -lt 10000000) { throw 'Cloud TEST Installer ist ungewoehnlich klein.' }
          Write-Host "Cloud TEST Installer erstellt. KEIN Release, KEIN Produktions-Update."
      - name: TEST Installer als Actions Artifact bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: TrummCards-Cloud-TEST-Windows-0.2.0
          path: cloud/desktop-test/dist/TrummCards-Cloud-TEST-0.2.0-Setup.exe
          if-no-files-found: error
          retention-days: 14
