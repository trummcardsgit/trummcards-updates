name: TrummCards Cloud PRODUCTION - Release Candidate (NO DEPLOY)
on:
  pull_request:
    paths:
      - 'cloud/desktop-production/**'
      - 'cloud/mobile-production/**'
      - 'cloud/release/**'
      - '.github/workflows/cloud-production-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-checks:
    name: PROD-Sicherheitschecks ohne Cloud-Schreibzugriff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Production PWA und Konfigurationsgrenzen pruefen
        run: |
          node --check cloud/mobile-production/web/app.js
          node --check cloud/mobile-production/web/catalog11.js
          node --check cloud/mobile-production/web/catalog11-ui.js
          node --check cloud/mobile-production/web/sets11-ui.js
          node --check cloud/mobile-production/web/market11-ui.js
          node --check cloud/mobile-production/web/fees11.js
          node --check cloud/mobile-production/web/fees11-ui.js
          node --check cloud/mobile-production/web/finance11.js
          node --check cloud/mobile-production/web/finance11-ui.js
          node --check cloud/mobile-production/web/cash11.js
          node --check cloud/mobile-production/web/cash11-ui.js
          node --check cloud/mobile-production/web/shipping11.js
          node --check cloud/mobile-production/web/shipping11-ui.js
          node --check cloud/mobile-production/web/reset-password.js
          node --check cloud/mobile-production/web/sw.js
          node --test cloud/mobile-production/tests/production.test.mjs
      - name: Production Anmeldung und RLS anonym schreibfrei pruefen
        run: |
          node --check cloud/release/probe-prod-anon.mjs
          node cloud/release/probe-prod-anon.mjs
      - name: Verschlüsseltes Backup offline testen
        run: |
          node --check cloud/backup/secure-archive.mjs
          node --check cloud/backup/create.mjs
          node --check cloud/backup/validate.mjs
          node --check cloud/backup/verify.mjs
          node --test cloud/backup/backup.test.mjs
      - name: Release 1.0 bleibt bis zu Backups, Restore und Freigabe gesperrt
        run: |
          node --check cloud/release/check-go-live.mjs
          node --test cloud/release/check-go-live.test.mjs
          node --test cloud/release/release-safety.test.mjs
          node --test cloud/release/feature-11.test.mjs
          node --test cloud/release/finance11.test.mjs
          node --test cloud/release/tcgdex11.test.mjs
          node --test cloud/release/shipping11.test.mjs
          node --test cloud/release/market-fees11.test.mjs
          node --test cloud/release/sets11.test.mjs
          node --test cloud/release/cash11.test.mjs
          node --test cloud/release/catalog-pagination-image11.test.mjs
      - name: Windows Cloud Source und Business-Logik pruefen
        working-directory: cloud/desktop-production
        run: |
          npm install --no-audit --no-fund
          npm run check
          npm run bundle
          test -s src/vendor.js
      - name: Kein Prod-Deployment, kein Schreibzugriff und kein Zugriff auf TEST
        run: echo 'Static tests and unauthenticated, read-only PROD API checks only. TEST, releases, PROD data and GitHub Pages stay unchanged.'
  local-restore:
    name: Offline-Backup wirklich in temporäres PostgreSQL 17 zurückspielen
    needs: offline-checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: trummcards_restore
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TC_BACKUP_PASSPHRASE: synthetic-example-only-for-ci-not-a-secret
      PG_RESTORE_URL: postgresql://postgres:local-test-only@127.0.0.1:5432/trummcards_restore
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Temporäre PostgreSQL Restore-Abhängigkeit installieren
        run: npm install --prefix cloud/backup --no-audit --no-fund --ignore-scripts
      - name: Fiktives verschlüsseltes Backup erzeugen und wiederherstellen
        run: |
          node cloud/backup/create-fixture.mjs "$RUNNER_TEMP/tc-synthetic.tcbackup"
          node cloud/backup/restore-check.mjs "$RUNNER_TEMP/tc-synthetic.tcbackup"
          rm -f "$RUNNER_TEMP/tc-synthetic.tcbackup"
  business-flow:
    name: Fiktive Ein- und Verkaeufe, FIFO, Storno und Bild-RLS im Wegwerf-PostgreSQL
    needs: offline-checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: trummcards_restore
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PG_RESTORE_URL: postgresql://postgres:local-test-only@127.0.0.1:5432/trummcards_restore
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Lokale PostgreSQL-Tests vorbereiten
        run: npm install --prefix cloud/backup --no-audit --no-fund --ignore-scripts
      - name: FIFO-Kosten, Umsatz, Storno, Doppelbuchung und Zugriffsschutz testen
        run: node cloud/backup/business-flow-check.mjs

  windows-preview:
    name: Isolierter Windows PROD-Vorschau-Installer (KEIN RELEASE)
    needs: [offline-checks, local-restore, business-flow]
    runs-on: windows-latest
    defaults:
      run:
        working-directory: cloud/desktop-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Abhaengigkeiten installieren
        shell: pwsh
        run: npm install --no-audit --no-fund
      - name: Pillow installieren
        shell: pwsh
        run: python -m pip install --disable-pip-version-check pillow
      - name: Windows Release Candidate und Update-Metadaten bauen (OHNE VERÖFFENTLICHUNG)
        shell: pwsh
        run: npm run dist
      - name: Cloud-Updatepaket isoliert pruefen
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $exe = "dist/TrummCards-Cloud-Setup-$version.exe"
          $yml = "dist/latest.yml"
          if (-not (Test-Path $exe)) { throw 'TrummCards Cloud EXE fehlt.' }
          if (-not (Test-Path $yml)) { throw 'Cloud Auto-Update Manifest latest.yml fehlt.' }
          if (-not (Test-Path "$exe.blockmap")) { throw 'Cloud Auto-Update .blockmap fehlt.' }
          if ((Get-Item $exe).Length -lt 10000000) { throw 'Cloud Installer ist zu klein.' }
          $meta = Get-Content $yml -Raw
          if (-not $meta.Contains((Split-Path $exe -Leaf))) { throw 'latest.yml verweist auf falschen Installer.' }
          if (-not $meta.Contains("version: $version")) { throw 'latest.yml hat falsche Version.' }
          Write-Host 'Windows Cloud RC und Update-Metadaten erfolgreich validiert. Es wird NICHTS deployed.'
      - name: Nur Vorschau-Artefakt fuer interne Tests bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: TrummCards-Cloud-PROD-RC-0.9.0-NO-RELEASE
          path: |
            cloud/desktop-production/dist/TrummCards-Cloud-Setup-0.9.0.exe
            cloud/desktop-production/dist/TrummCards-Cloud-Setup-0.9.0.exe.blockmap
            cloud/desktop-production/dist/latest.yml
          if-no-files-found: error
          retention-days: 14

  isolated-cloud-1-release-rehearsal:
    name: Cloud 1.0 – Windows-Buildprobe OHNE Veröffentlichung
    needs: [offline-checks, local-restore, business-flow]
    runs-on: windows-latest
    timeout-minutes: 40
    # These values are synthetic CI-only gate inputs; NO publish token and NO deployment.
    # Only an ephemeral GitHub runner checkout is modified; TEST and PROD are untouched.
    env:
      TRUMMCARDS_BACKUP_ACTIVE: 'true'
      TRUMMCARDS_RESTORE_VERIFIED: 'true'
      TRUMMCARDS_PRODUCTION_APPROVED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 1.0 Umschaltung im isolierten Checkout trocken pruefen
        shell: pwsh
        run: node cloud/release/prepare-go-live.mjs --dry-run
      - name: 1.0 nur im temporaeren CI-Checkout aktivieren
        shell: pwsh
        run: |
          node cloud/release/prepare-go-live.mjs
          if ($LASTEXITCODE -ne 0) { throw '1.0 Build-Umschaltung fehlgeschlagen.' }
          node cloud/release/check-go-live.mjs
          if ($LASTEXITCODE -ne 0) { throw '1.0 Gate-Probe fehlgeschlagen.' }
          node --test cloud/mobile-production/tests/release.test.mjs
          if ($LASTEXITCODE -ne 0) { throw '1.0 PWA-Tests fehlgeschlagen.' }
      - name: Release-Code und Windows-App pruefen
        shell: pwsh
        working-directory: cloud/desktop-production
        run: |
          npm install --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Abhaengigkeiten fehlgeschlagen.' }
          npm run check
          if ($LASTEXITCODE -ne 0) { throw 'Windows-Tests fehlgeschlagen.' }
      - name: Windows-Icon generieren
        shell: pwsh
        run: python -m pip install --disable-pip-version-check pillow
      - name: 1.0 Windows-Installer und Cloud-Update-Manifest bauen (nur CI)
        shell: pwsh
        working-directory: cloud/desktop-production
        run: |
          npm run dist
          if ($LASTEXITCODE -ne 0) { throw 'Windows-1.0-Installer-Build fehlgeschlagen.' }
          $exe = 'dist/TrummCards-Cloud-Setup-1.0.0.exe'
          $meta = 'dist/latest.yml'
          if (-not (Test-Path $exe) -or -not (Test-Path "$exe.blockmap") -or -not (Test-Path $meta)) {
            throw 'Cloud 1.0 Installer, Blockmap oder Update-Manifest fehlt.'
          }
          $manifest = Get-Content $meta -Raw
          if (-not $manifest.Contains('TrummCards-Cloud-Setup-1.0.0.exe') -or -not $manifest.Contains('version: 1.0.0')) {
            throw 'Release-Update-Manifest verweist nicht auf Cloud 1.0.0.'
          }
          Write-Host 'Cloud-1.0-Buildprobe erfolgreich. KEIN Upload, KEIN Release, KEIN Deployment.'
