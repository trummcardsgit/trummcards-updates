name: TrummCards Cloud 1.1 TEST - Isolated Build

on:
  push:
    branches: [feature/cloud-1.1-unified]
    paths: ['cloud/**', '.github/workflows/cloud-11-test-build.yml']
  workflow_dispatch:

concurrency:
  group: trummcards-cloud11-test-build
  cancel-in-progress: true
permissions:
  contents: write
  pages: write

jobs:
  pwa-test:
    name: Separate 1.1 TEST PWA - never modify PROD or old TEST root
    if: github.repository == 'trummcardsgit/trummcards-updates' && github.ref == 'refs/heads/feature/cloud-1.1-unified'
    runs-on: ubuntu-latest
    env:
      TRUMMCARDS_TEST11_ENABLE: I_ACKNOWLEDGE_TEST_ONLY
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build TEST-only client in disposable checkout
        run: |
          node --check cloud/release/prepare-cloud-11-test.mjs
          node cloud/release/prepare-cloud-11-test.mjs
      - name: Check TEST endpoint, PWA scripts, service worker and session isolation
        shell: bash
        run: |
          set -euo pipefail
          for f in cloud/mobile-production/web/*.js; do node --check "$f"; done
          grep -F "const PROJECT='cpycfxolqpidfjbhhsmr';" cloud/mobile-production/web/app.js
          grep -F 'const WRITES_ENABLED=true;' cloud/mobile-production/web/app.js
          grep -F 'trummcards-mobile-test11-session-v1' cloud/mobile-production/web/app.js
          if grep -R -F 'hgdexyvtgfffcasfpjyu' cloud/mobile-production/web; then
            echo 'FATAL: production reference found'; exit 1
          fi
          grep -F 'trummcards-mobile-test11-shell-' cloud/mobile-production/web/sw.js
          node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('cloud/mobile-production/web/manifest.webmanifest','utf8'));if(m.name!=='TrummCards Cloud 1.1 TEST')process.exit(1)"
      - name: Preserve TEST PWA package as downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrummCards-Cloud-11-TEST-PWA
          path: cloud/mobile-production/web/
          if-no-files-found: error
          retention-days: 14
      - name: Publish ONLY test-11/ in isolated GitHub Pages worktree
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin +refs/heads/gh-pages:refs/remotes/origin/gh-pages
          pages_dir="$RUNNER_TEMP/trummcards-test11-pages"
          git worktree add --detach "$pages_dir" refs/remotes/origin/gh-pages
          mkdir -p "$pages_dir/test-11"
          cp -R cloud/mobile-production/web/. "$pages_dir/test-11/"
          git -C "$pages_dir" add -- test-11
          bad="$(git -C "$pages_dir" diff --cached --name-only | grep -v '^test-11/' || true)"
          test -z "$bad" || { echo "Out-of-scope Pages change: $bad"; exit 1; }
          if git -C "$pages_dir" diff --cached --quiet; then
            echo "TEST PWA already identical."
          else
            git -C "$pages_dir" config user.name "github-actions[bot]"
            git -C "$pages_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C "$pages_dir" commit -m "TEST ONLY: Update Cloud 1.1 PWA under test-11/"
            git -C "$pages_dir" push origin HEAD:gh-pages
          fi
      - name: Trigger Pages rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"

  windows-test:
    name: Independent Windows TEST 1.1 installer - no PROD updater
    if: github.repository == 'trummcardsgit/trummcards-updates' && github.ref == 'refs/heads/feature/cloud-1.1-unified'
    runs-on: windows-latest
    env:
      TRUMMCARDS_TEST11_ENABLE: I_ACKNOWLEDGE_TEST_ONLY
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install desktop dependencies
        shell: pwsh
        working-directory: cloud/desktop-production
        run: |
          npm install --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'npm install failed' }
      - name: Install icon generator
        shell: pwsh
        run: python -m pip install --disable-pip-version-check pillow
      - name: Patch Windows build to TEST in disposable runner only
        shell: pwsh
        run: |
          node cloud/release/prepare-cloud-11-test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'TEST config failed' }
          $source = Get-Content 'cloud/desktop-production/src/app.js' -Raw
          if ($source.Contains('hgdexyvtgfffcasfpjyu') -or -not $source.Contains('cpycfxolqpidfjbhhsmr')) { throw 'Wrong database target' }
          $main = Get-Content 'cloud/desktop-production/main.cjs' -Raw
          if (-not $main.Contains('const UPDATE_FEED_ENABLED=false;')) { throw 'Updater must remain off' }
      - name: Build independent Cloud 1.1 TEST Windows installer
        shell: pwsh
        working-directory: cloud/desktop-production
        run: |
          npm run dist
          if ($LASTEXITCODE -ne 0) { throw 'TEST Windows build failed' }
          $exe = 'dist/TrummCards-Cloud-11-TEST-Setup-1.1.0-test.1.exe'
          if (-not (Test-Path $exe)) { throw 'TEST installer missing' }
          if ((Get-Item $exe).Length -lt 10000000) { throw 'TEST installer unusually small' }
          Write-Host 'Windows TEST installer OK - not published to PROD update feed'
      - name: Keep Windows TEST installer for manual testing
        uses: actions/upload-artifact@v4
        with:
          name: TrummCards-Cloud-11-TEST-Windows
          path: cloud/desktop-production/dist/TrummCards-Cloud-11-TEST-Setup-1.1.0-test.1.exe
          if-no-files-found: error
          retention-days: 14
