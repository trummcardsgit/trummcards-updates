name: TrummCards Cloud 1.1 - Production Upgrade Rehearsal (NO DEPLOY)
on:
  push:
    branches: [release/cloud-1.1.0-production-upgrade]
    paths:
      - 'cloud/**'
      - '.github/workflows/cloud-11-production-rehearsal.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: trummcards-cloud11-release-rehearsal
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    env:
      TRUMMCARDS_BACKUP_ACTIVE: 'true'
      TRUMMCARDS_RESTORE_VERIFIED: 'true'
      TRUMMCARDS_PRODUCTION_APPROVED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify existing 1.1 code before staging
        run: |
          node --test cloud/release/feature-11.test.mjs cloud/release/finance11.test.mjs cloud/release/tcgdex11.test.mjs cloud/release/shipping11.test.mjs cloud/release/market-fees11.test.mjs cloud/release/sets11.test.mjs cloud/release/cash11.test.mjs cloud/release/catalog-pagination-image11.test.mjs
          node --test cloud/backup/backup.test.mjs
      - name: Stage 1.1 only in temporary checkout
        run: |
          node cloud/release/prepare-cloud-11-production.mjs
          node cloud/release/finalize-cloud-11-ui.mjs
          node cloud/release/finalize-cloud-11-pwa.mjs
          node cloud/release/check-cloud-11-production.mjs
          for f in cloud/mobile-production/web/*.js; do node --check "$f"; done
      - name: Verify actual production RLS read-only probe
        run: node cloud/release/probe-prod-anon.mjs
      - name: Keep isolated PWA artifact; never change live Pages
        uses: actions/upload-artifact@v4
        with:
          name: TrummCards-Cloud-11-PROD-STAGED-PWA-NO-DEPLOY
          path: cloud/mobile-production/web/
          retention-days: 7
          if-no-files-found: error

  windows-rehearsal:
    runs-on: windows-latest
    needs: preflight
    env:
      TRUMMCARDS_BACKUP_ACTIVE: 'true'
      TRUMMCARDS_RESTORE_VERIFIED: 'true'
      TRUMMCARDS_PRODUCTION_APPROVED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Create production 1.1 staging only
        shell: pwsh
        run: |
          node cloud/release/prepare-cloud-11-production.mjs
          node cloud/release/finalize-cloud-11-ui.mjs
          node cloud/release/finalize-cloud-11-pwa.mjs
          node cloud/release/check-cloud-11-production.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Production staging failed.' }
      - name: Install build dependencies
        working-directory: cloud/desktop-production
        shell: pwsh
        run: |
          npm install --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'npm install failed.' }
      - name: Install icon builder
        shell: pwsh
        run: python -m pip install --disable-pip-version-check pillow
      - name: Test and build production updater assets
        working-directory: cloud/desktop-production
        shell: pwsh
        run: |
          npm run dist
          if ($LASTEXITCODE -ne 0) { throw 'Windows build failed.' }
          $d='dist'
          $exe='TrummCards-Cloud-Setup-1.1.0.exe'
          foreach($file in @($exe,"$exe.blockmap",'latest.yml')){
            if(-not(Test-Path "$d/$file")){ throw "Missing update file: $file" }
          }
          $meta=Get-Content "$d/latest.yml" -Raw
          if(-not $meta.Contains('version: 1.1.0') -or -not $meta.Contains($exe)){throw 'Wrong update manifest.'}
          if((Get-Item "$d/$exe").Length -lt 10000000){throw 'Installer too small.'}
      - name: Store windows packages only (NO LIVE RELEASE)
        uses: actions/upload-artifact@v4
        with:
          name: TrummCards-Cloud-11-PROD-STAGED-Windows-NO-DEPLOY
          path: |
            cloud/desktop-production/dist/TrummCards-Cloud-Setup-1.1.0.exe
            cloud/desktop-production/dist/TrummCards-Cloud-Setup-1.1.0.exe.blockmap
            cloud/desktop-production/dist/latest.yml
          retention-days: 7
          if-no-files-found: error

  fresh-production-backup:
    runs-on: ubuntu-latest
    needs: preflight
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: trummcards_restore
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TC_BACKUP_EMAIL: ${{ secrets.TC_PROD_BACKUP_EMAIL }}
      TC_BACKUP_PASSWORD: ${{ secrets.TC_PROD_BACKUP_PASSWORD }}
      TC_BACKUP_PASSPHRASE: ${{ secrets.TC_PROD_BACKUP_PASSPHRASE }}
      PG_RESTORE_URL: postgresql://postgres:local-test-only@127.0.0.1:5432/trummcards_restore
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require configured encrypted backup secrets
        run: |
          test -n "$TC_BACKUP_EMAIL"
          test -n "$TC_BACKUP_PASSWORD"
          test ${#TC_BACKUP_PASSPHRASE} -ge 24
      - name: Install local restore dependencies
        run: npm install --prefix cloud/backup --no-audit --no-fund --ignore-scripts
      - name: Create and verify current real production backup with image bytes
        run: |
          mkdir -p "$RUNNER_TEMP/tcbackup"
          f="$RUNNER_TEMP/tcbackup/TrummCards-PROD-pre-1.1-${{ github.run_id }}.tcbackup"
          node cloud/backup/create.mjs "$f"
          node cloud/backup/verify.mjs "$f"
          node cloud/backup/restore-check.mjs "$f"
      - name: Retain only encrypted artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrummCards-PROD-Encrypted-PRE-11-${{ github.run_id }}
          path: ${{ runner.temp }}/tcbackup/*.tcbackup
          if-no-files-found: error
          retention-days: 30
